[project]
name = "timewizard"
version = "0.1.0"
description = "LFM2.5-VL-450M fine-tuned to read analog clocks in photographs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "imagehash==4.3.2",
  "numpy==2.5.2",
  "opencv-python-headless==5.0.0.93",
  "pillow==12.3.0",
  "pydantic==2.13.5",
  "synclock",
  "tyro==1.0.16",
]

[dependency-groups]
baselines = [
    "pydantic-ai-slim[anthropic,bedrock,bedrock-mantle,retries]==2.37.0",
    "tenacity==9.1.4",
    "tqdm==4.70.0",
]
dev = ["pytest==9.1.1", "ruff==0.16.5", "ty==0.0.77"]
train = [
    "torch==2.14.0",
    "transformers==5.16.1",
    "trl==1.12.0",
    "peft==0.20.0",
    "accelerate==1.14.0",
    "torchvision==0.29.0",
]

[tool.uv]
default-groups = ["dev", "train", "baselines"]

[tool.uv.sources]
synclock = { git = "https://github.com/jadidbourbaki/itsabouttime", rev = "248523d7269461a43f8588dcede7473c2edd19fd" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timewizard"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
