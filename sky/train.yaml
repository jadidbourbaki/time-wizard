name: time-wizard-train

resources:
  infra: nebius
  instance_type: gpu-h100-sxm_1gpu-16vcpu-200gb
  disk_size: 256
  autostop:
    idle_minutes: 15
    down: true

workdir: .

envs:
  TRAIN_ARGS: --out runs/nebius
  TORCH_DISABLE_NATIVE_JIT: "1"

secrets:
  HF_TOKEN: null

setup: |
  set -euo pipefail
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  nvidia-smi
  uv run python -m timewizard.photos pull
  uv run python -m timewizard.train $TRAIN_ARGS
  uv run python -m timewizard.bench --checkpoint runs/nebius/model --split dev
