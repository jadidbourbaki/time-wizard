# Fine-tune LFM2.5-VL-450M on Nebius. Launch with `just sky-train`.
name: time-wizard-train

resources:
  infra: nebius
  # gpu-l40s-a has no capacity in eu-north1. Only the AMD host platform does.
  instance_type: gpu-l40s-d_1gpu-16vcpu-96gb
  disk_size: 256

workdir: .

envs:
  TRAIN_ARGS: --out runs/nebius --epochs 3

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv sync

run: |
  export PATH="$HOME/.local/bin:$PATH"
  nvidia-smi
  uv run python -m timewizard.photos pull
  uv run python -m timewizard.train $TRAIN_ARGS
  uv run python -m timewizard.bench --adapter runs/nebius/adapter --split dev
